          - text: >- #human
              According to [WCAG2ICT "Problematic for closed"](wcag2ict_A_3_26), the intent of WCAG 3.1.2 is correct pronunciation.
        differences:
          - TODO

  - id: en301549_v3_v4_accessible_content_creation
