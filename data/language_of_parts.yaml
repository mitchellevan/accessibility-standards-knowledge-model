      text_kind: paraphrase

relationships:
  - id: en-v3-documentation-clauses
    type: similar
    subjects:
      - en301549v321_12_1_2
      - en301549v321_12_2_4
    aspects:
      applicability:
        assessment: similar
        rationale:
          arguments_for:
            - >-
              Both concern documentation, and their practical scopes can
              overlap.
          arguments_against:
            - >-
              They differ primarily in whether documentation is provided with
              the ICT or by support services.
            - >-
              "Product documentation" can be narrower than "documentation."
      expectations:
        assessment: same
        rationale:
          arguments_for:
            - >-
              The expectations differ only in notes that do not change their
              intent.

  - id: en-v3-v4-product-and-service-information
    type: similar
    subjects:
      - - en301549v321_12_1_2
        - en301549v321_12_2_4
      - - en301549v411_12_1
        - en301549v411_12_2
    aspects:
      applicability:
        assessment: similar
        rationale:
          arguments_for:
            - Both versions apply to digital information.
            - >-
              The contributor interprets V3 "products" as substantially
              overlapping with V4 "products and services."
          arguments_against:
            - >-
              V3 also applies to non-digital information such as a print manual.
            - >-
              V4 service information can cover non-digital aspects of services
              and therefore be broader than V3 product documentation.
      expectations:
        assessment: similar
        rationale:
          arguments_for:
            - >-
              References to clauses 9 and 10 produce many of the same WCAG-based
              expectations.
          arguments_against:
            - V4 incorporates WCAG 2.2 and has other clause 9 and 10 differences.
            - >-
              V4 permits product information in non-web software, while V3
              requires a web or non-web document format.

  - id: en-spoken-languages-v3-v4
    type: same
    subjects:
      - en301549v321_5_1_3_14
      - en301549v411_5_1_3_14
    aspects:
      applicability:
        assessment: same
        rationale:
          arguments_for:
            - >-
              The V4 wording is more precise but conveys the same intent as V3.
      expectations:
        assessment: same
        rationale:
          arguments_for:
            - The source wording is identical.

  - id: programmatic-language-vs-spoken-language
    type: similar
    subjects:
      - - wcag22_3_1_2
        - wcag2ict_3_1_2
        - en301549v411_9_3_1_2
        - en301549v411_10_3_1_2
      - - en301549v321_5_1_3_14
        - en301549v411_5_1_3_14
        - wcag2ict_A_3_26
    aspects:
      applicability:
        assessment: different
        rationale:
          arguments_for:
            - The first group concerns open content; the second concerns closed functionality.
      expectations:
        assessment: similar
        rationale:
          arguments_for:
            - >-
              Understanding WCAG 2.2 SC 3.1.2 identifies correct screen-reader
              pronunciation as part of the criterion's intent.
            - >-
              WCAG2ICT fragment A_3.26 likewise identifies correct pronunciation
              as the intent.
          citations:
            - uri: https://www.w3.org/WAI/WCAG22/Understanding/language-of-parts.html
              retrieved: 2026-07-12
            - source_fragment: wcag2ict_A_3_26

  - id: open-content-vs-authoring-open-content
    type: todo
    subjects:
      - - wcag22_3_1_2
        - wcag2ict_3_1_2
      - - en301549v321_11_8_2
        - en301549v411_5_10_2
    note: >-
      Define a relationship between a requirement evaluated on content and an
      authoring-tool requirement evaluated through the content it produces.

non_expectations:
  - source_document: bik_bitv_test_app
    subject: language-of-parts
    observation: No test is present.
    retrieved: 2026-07-10
    comment: >-
      The omission is consistent with the test's stated scope and EN 301 549
      V3.2.1, which has no language-of-parts guideline for open non-web software.

  - source_document: bik_bitv_wcag22_app
    subject: language-of-parts
    observation: No test is present.
    retrieved: 2026-07-10
    comment: Same rationale as BIK BITV-Test (App).

  - source_document: bik_wcag2ict_test_app
    subject: language-of-parts
    observation: No test is present.
    retrieved: 2026-07-10
    comment: >-
      The omission is not consistent with the stated WCAG2ICT-based scope,
      because WCAG2ICT provides guidance for Language of Parts.

todos:
  - id: model-eaa-connections
    text: Model EAA connections using EN 301 549 V4 Annex ZB.
  - id: model-authoring-support
    text: >-
      Add preservation, repair-assistance, and template clauses from EN 301 549
      V3.2.1 clauses 11.8.3–11.8.5 and V4.1.0 clauses 5.10.3–5.10.5.
  - id: compare-en-clause-9
    text: Compare clause 9 differences between EN 301 549 V3.2.1 and V4.1.0.
  - id: compare-en-clause-10
    text: Compare clause 10 differences between EN 301 549 V3.2.1 and V4.1.0.
  - id: clarify-software-technology
    text: >-
      Review whether product or service information in non-web software should
      be classified as open_non_web_software or a broader non-web software type.
