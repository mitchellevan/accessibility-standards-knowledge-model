# TODO move technology types to their own file
technology_types:
  web:
    name: Web content
  non_web_document:
    name: Non-web document
  open_non_web_software:
    name: Non-web software open to assistive technology
  closed_functionality:
    name: Functionality closed to assistive technology
  non_digital_documentation:
    name: Non-digital documentation

fragments:
  # TODO check whether underscores in this token lose any meaningful distinction between . and _ in the identifier
  wcag22_3_1_2:
    # TODO is 'type' redundant, given that we're in a section called 'fragments'?
    type: source-fragment
    source_document: wcag22
    # TODO just for readability, move identifier and name to the top of each block.
    identifier: "3.1.2"
    fragment_class: success-criterion
    name: Language of Parts
    uri: https://www.w3.org/TR/WCAG22/#language-of-parts
    # TODO think about this idea: "when" and "then" instead of "applicability_conditions" and "expectations"?
    guideline:
      applicability_conditions:
        - technology: web
      expectations:
        #TODO is this 'id' defining a shared object? If so then the same id shouldn't have different text when used elsewhere, but the different text can be a comment on the relationship.
        - id: identify-language-of-parts
          text: The human language of each phrase is programmatically identified.
          text_kind: paraphrase

  wcag2ict_3_1_2:
    type: source-fragment
    source_document: wcag2ict
    identifier: "3.1.2"
    fragment_class: success-criterion
    name: Language of Parts
    uri: https://www.w3.org/TR/wcag2ict/#language-of-parts
    guideline:
      applicability_conditions:
        # TODO elsewhere a list of conditions is "and" (which is a sensible default). Here it's "or". How to express that?
        - technology: non_web_document
        - technology: open_non_web_software
      expectations:
        - id: identify-language-of-parts
          #TODO How to structure relationships deterministically? This is currently just a prose description of a relationship.
          #TODO Both the text and the text_kind read like a comment on the expectation. This is good, but it should be a 'comment' or 'analysis' property of the expectation, not just the 'text' of the expectation.
          #TODO here and elsewhere, comments should identify whether they are 'pro' or 'con' for the thing commented on.
          text: >-
            The expectation is the same as WCAG 2.2 SC 3.1.2, with a minor
            substitution of non-web terminology and with added notes.
          # TODO change this to provenance of the comment. Need to think about the available values. "Analysis" is too vague. It should cite the source, with the plain meaning of the fragment itself the most common one. (Since it's very common, should we state it, or is it assumed without stating it?) The citation becomes interesting when the it points somewhere else in the same source document or a different one.
          text_kind: contributor-analysis

  # TODO is there a way we can generalize to all 9.x clauses, to avoid the high amount of repetition this would otherwise entail?
  en301549v321_9_3_1_2:
    type: source-fragment
    source_document: en301549v321
    identifier: "9.3.1.2"
    fragment_class: clause
    name: Language of parts
    guideline:
      applicability_conditions:
        - technology: web
      expectations:
        - id: identify-language-of-parts
          text: Same as the corresponding V4.1.0 clause, with minor editorial differences.
          text_kind: contributor-analysis

  # TODO is there a way we can generalize to all 10.x clauses as the default, summarizing that some are IBR and some use word substitution? Only ones with substantive edits should get their own fragment analysis.
  en301549v321_10_3_1_2:
    type: source-fragment
    source_document: en301549v321
    identifier: "10.3.1.2"
    fragment_class: clause
    name: Language of parts
    guideline:
      applicability_conditions:
        - technology: non_web_document
      expectations:
        - id: identify-language-of-parts
          text: Same as the corresponding V4.1.0 clause, with minor editorial differences.
          text_kind: contributor-analysis

  # TODO like v3
  en301549v411_9_3_1_2:
    type: source-fragment
    source_document: en301549v411
    identifier: "9.3.1.2"
    fragment_class: clause
    name: Language of parts
    uri: >-
      https://www.etsi.org/deliver/etsi_en/301500_301599/301549/04.01.00_30/en_301549v040100va.pdf?page=67
    guideline:
      applicability_conditions:
        - technology: web
      expectations:
        - id: identify-language-of-parts
          text: Includes WCAG 2.2 SC 3.1.2 by reference.
          text_kind: contributor-analysis

  # TODO like v3
  en301549v411_10_3_1_2:
    type: source-fragment
    source_document: en301549v411
    identifier: "10.3.1.2"
    fragment_class: clause
    name: Language of parts
    uri: >-
      https://www.etsi.org/deliver/etsi_en/301500_301599/301549/04.01.00_30/en_301549v040100va.pdf?page=82
    guideline:
      applicability_conditions:
        - technology: non_web_document
      expectations:
        - id: identify-language-of-parts
          text: The human language of each phrase is programmatically identified.
          text_kind: paraphrase

  en301549v321_12_1_2:
    type: source-fragment
    source_document: en301549v321
    identifier: "12.1.2"
    fragment_class: clause
    name: Accessible documentation
    uri: >-
      https://www.etsi.org/deliver/etsi_en/301500_301599/301549/03.02.01_60/en_301549v030201p.pdf?page=84
    guideline:
      # TODO guideline with 3 cases can work. But think about this alternative: 3 guidelines.
      cases:
        # TODO is there a namespace within which these ids are unique?
        - id: documentation-in-any-format
          applicability_conditions:
            - text: Product documentation is provided with the ICT in any format.
          expectations:
            - text: >-
                The product documentation is made available in a web format or
                non-web document format.
              text_kind: paraphrase
        - id: documentation-in-web-format
          applicability_conditions:
            #TODO state in ASKM documentation that a list of applicability conditions is "and". This is fairly intuitive because the word "conditions" implies 'and', but should be made explicit in the ASKM documentation. (All the more so if I were to change "applicability_conditions" to "when".)
          applicability_conditions:
            - technology: web
            - text: Product documentation in web format is provided with the ICT.
          expectations:
            - text: The product documentation meets clause 9.
              text_kind: contributor-analysis
        - id: documentation-in-non-web-format
          applicability_conditions:
            - technology: non_web_document
            - text: >-
                Product documentation in a non-web document format is provided
                with the ICT.
          expectations:
            - text: The product documentation meets clause 10.
              text_kind: contributor-analysis

  en301549v321_12_2_4:
    type: source-fragment
    source_document: en301549v321
    identifier: "12.2.4"
    fragment_class: clause
    name: Accessible documentation
    uri: >-
      https://www.etsi.org/deliver/etsi_en/301500_301599/301549/03.02.01_60/en_301549v030201p.pdf?page=85
    guideline:
      cases:
        - id: support-documentation-in-any-format
          applicability_conditions:
            - text: Documentation is provided in any format by support services.
          expectations:
            - text: >-
                The documentation is made available in a web format or non-web
                document format.
              text_kind: paraphrase
        - id: support-documentation-in-web-format
          applicability_conditions:
            - technology: web
            # TODO Is "in web format" in the text redundant to 'technology: web' ? Here and elsewhere
            - text: Documentation in web format is provided by support services.
          expectations:
            - text: The documentation meets clause 9.
              text_kind: contributor-analysis
        - id: support-documentation-in-non-web-format
          applicability_conditions:
            - technology: non_web_document
            - text: >-
                Documentation in a non-web document format is provided by
                support services.
          expectations:
            - text: The documentation meets clause 10.
              text_kind: contributor-analysis

  en301549v411_12_1:
    type: source-fragment
    source_document: en301549v411
    identifier: "12.1"
    fragment_class: clause
    name: Accessibility information about products
    uri: >-
      https://www.etsi.org/deliver/etsi_en/301500_301599/301549/04.01.00_30/en_301549v040100va.pdf?page=106
    guideline:
      cases:
        - id: product-information-in-web-content
          applicability_conditions:
            - technology: web
            - text: Web content provides information about a product.
          expectations:
            - text: The information meets clause 9.
              text_kind: contributor-analysis
        - id: product-information-in-non-web-document
          applicability_conditions:
            - technology: non_web_document
            - text: A non-web document provides information about a product.
          expectations:
            - text: The information meets clause 10.
              text_kind: contributor-analysis
        - id: product-information-in-non-web-software
          applicability_conditions:
            - technology: open_non_web_software
            - text: Non-web software provides information about a product.
          expectations:
            - text: The information meets clause 11.
              text_kind: contributor-analysis

  en301549v411_12_2:
    type: source-fragment
    source_document: en301549v411
    identifier: "12.2"
    fragment_class: clause
    name: Accessibility information about services
    uri: >-
      https://www.etsi.org/deliver/etsi_en/301500_301599/301549/04.01.00_30/en_301549v040100va.pdf?page=107
    guideline:
      cases:
        - id: service-information-in-web-content
          applicability_conditions:
            - technology: web
            - text: Web content provides information about a service.
          expectations:
            - text: The information meets clause 9.
              text_kind: contributor-analysis
        - id: service-information-in-non-web-document
          applicability_conditions:
            - technology: non_web_document
            - text: A non-web document provides information about a service.
          expectations:
            - text: The information meets clause 10.
              text_kind: contributor-analysis
        - id: service-information-in-non-web-software
          applicability_conditions:
            - technology: open_non_web_software
            - text: Non-web software provides information about a service.
          expectations:
            - text: The information meets clause 11.
              text_kind: contributor-analysis

  en301549v321_11_8_2:
    type: source-fragment
    source_document: en301549v321
    identifier: "11.8.2"
    fragment_class: clause
    name: Accessible content creation
    guideline:
      cases:
        - id: creates-web-content
          applicability_conditions:
            - text: A content creation tool creates web content.
          expectations:
            - text: >-
                The tool enables and guides users to create content meeting
                clause 9, to the extent described in clause 11.8.1.
              text_kind: contributor-analysis
        - id: creates-non-web-documents
          applicability_conditions:
            - text: A content creation tool creates non-web document content.
          expectations:
            - text: >-
                The tool enables and guides users to create content meeting
                clause 10, to the extent described in clause 11.8.1.
              text_kind: contributor-analysis

  en301549v411_5_10_2:
    type: source-fragment
    source_document: en301549v411
    identifier: "5.10.2"
    fragment_class: clause
    name: Accessible content creation
    guideline:
      cases:
        - id: creates-web-content
          applicability_conditions:
            - text: An authoring tool creates web content.
          expectations:
            - text: >-
                The tool enables and guides users to create content meeting
                clause 9, to the extent described in clause 5.10.1.
              text_kind: contributor-analysis
        - id: creates-non-web-documents
          applicability_conditions:
            - text: An authoring tool creates non-web document content.
          expectations:
            - text: >-
                The tool enables and guides users to create content meeting
                clause 10, to the extent described in clause 5.10.1.
              text_kind: contributor-analysis
        - id: creates-non-web-software
          applicability_conditions:
            - text: An authoring tool creates non-web software content.
          expectations:
            - text: >-
                The tool enables and guides users to create content meeting
                clause 11, to the extent described in clause 5.10.1.
              text_kind: contributor-analysis

  en301549v321_5_1_3_14:
    type: source-fragment
    source_document: en301549v321
    identifier: "5.1.3.14"
    fragment_class: clause
    name: Spoken languages
    guideline:
      applicability_conditions:
        - technology: closed_functionality
        - text: Speech output is provided as non-visual access to closed functionality.
      expectations:
        - id: match-spoken-and-visual-language
          text: >-
            The human language of speech output is the same as the human
            language of the visual content, subject to exceptions in the source.
          text_kind: paraphrase

  en301549v411_5_1_3_14:
    type: source-fragment
    source_document: en301549v411
    identifier: "5.1.3.14"
    fragment_class: clause
    name: Spoken languages
    guideline:
      applicability_conditions:
        - technology: closed_functionality
        - text: >-
            ICT includes closed functionality, and speech output is provided as
            non-visual access to that closed functionality.
      expectations:
        - id: match-spoken-and-visual-language
          text: >-
            The human language of speech output is the same as the human
            language of the visual content, subject to exceptions in the source.
          text_kind: paraphrase

  wcag2ict_A_3_26:
    type: source-fragment
    source_document: wcag2ict
    identifier: A_3.26
    fragment_class: fragment
    name: 3.1.2 Language of Parts
    guideline:
      applicability_conditions:
        - technology: closed_functionality
        - text: >-
            Consider criterion-by-criterion applicability and alternate
            accessibility provisions instead of assuming WCAG applies.
          text_kind: contributor-analysis
      expectations:
        - text: Pronunciation is correct.
          text_kind: paraphrase

  en301549v321_11_3_1_2:
    type: source-fragment
    source_document: en301549v321
    identifier: "11.3.1.2"
    fragment_class: clause
    name: Void
    non_expectation:
      text: >-
        The note says that a language-of-parts requirement would be impossible
        for software.
      text_kind: paraphrase

  en301549v411_11_3_1_2:
    type: source-fragment
    source_document: en301549v411
    identifier: "11.3.1.2"
    fragment_class: clause
    name: Language of Parts (Void)
    non_expectation:
      text: >-
        The note says that a language-of-parts requirement would be impossible
        for software.
      text_kind: paraphrase

relationships:
  - id: en-v3-documentation-clauses
    type: similar
    subjects:
      - en301549v321_12_1_2
      - en301549v321_12_2_4
    aspects:
      applicability:
        assessment: similar
        rationale:
          arguments_for:
            - >-
              Both concern documentation, and their practical scopes can
              overlap.
          arguments_against:
            - >-
              They differ primarily in whether documentation is provided with
              the ICT or by support services.
            - >-
              "Product documentation" can be narrower than "documentation."
      expectations:
        assessment: same
        rationale:
          arguments_for:
            - >-
              The expectations differ only in notes that do not change their
              intent.

  - id: en-v3-v4-product-and-service-information
    type: similar
    subjects:
      - - en301549v321_12_1_2
        - en301549v321_12_2_4
      - - en301549v411_12_1
        - en301549v411_12_2
    aspects:
      applicability:
        assessment: similar
        rationale:
          arguments_for:
            - Both versions apply to digital information.
            - >-
              The contributor interprets V3 "products" as substantially
              overlapping with V4 "products and services."
          arguments_against:
            - >-
              V3 also applies to non-digital information such as a print manual.
            - >-
              V4 service information can cover non-digital aspects of services
              and therefore be broader than V3 product documentation.
      expectations:
        assessment: similar
        rationale:
          arguments_for:
            - >-
              References to clauses 9 and 10 produce many of the same WCAG-based
              expectations.
          arguments_against:
            - V4 incorporates WCAG 2.2 and has other clause 9 and 10 differences.
            - >-
              V4 permits product information in non-web software, while V3
              requires a web or non-web document format.

  - id: en-spoken-languages-v3-v4
    type: same
    subjects:
      - en301549v321_5_1_3_14
      - en301549v411_5_1_3_14
    aspects:
      applicability:
        assessment: same
        rationale:
          arguments_for:
            - >-
              The V4 wording is more precise but conveys the same intent as V3.
      expectations:
        assessment: same
        rationale:
          arguments_for:
            - The source wording is identical.

  - id: programmatic-language-vs-spoken-language
    type: similar
    subjects:
      - - wcag22_3_1_2
        - wcag2ict_3_1_2
        - en301549v411_9_3_1_2
        - en301549v411_10_3_1_2
      - - en301549v321_5_1_3_14
        - en301549v411_5_1_3_14
        - wcag2ict_A_3_26
    aspects:
      applicability:
        assessment: different
        rationale:
          arguments_for:
            - The first group concerns open content; the second concerns closed functionality.
      expectations:
        assessment: similar
        rationale:
          arguments_for:
            - >-
              Understanding WCAG 2.2 SC 3.1.2 identifies correct screen-reader
              pronunciation as part of the criterion's intent.
            - >-
              WCAG2ICT fragment A_3.26 likewise identifies correct pronunciation
              as the intent.
          citations:
            - uri: https://www.w3.org/WAI/WCAG22/Understanding/language-of-parts.html
              retrieved: 2026-07-12
            - source_fragment: wcag2ict_A_3_26

  - id: open-content-vs-authoring-open-content
    type: todo
    subjects:
      - - wcag22_3_1_2
        - wcag2ict_3_1_2
      - - en301549v321_11_8_2
        - en301549v411_5_10_2
    note: >-
      Define a relationship between a requirement evaluated on content and an
      authoring-tool requirement evaluated through the content it produces.

