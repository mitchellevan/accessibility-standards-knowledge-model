fragments:
  # TODO check whether underscores in this token lose any meaningful distinction between . and _ in the identifier
  wcag22_3_1_2:
    identifier: "3.1.2"
    name: Language of Parts
    source_document: wcag22
    fragment_class: success-criterion
    uri: https://www.w3.org/TR/WCAG22/#language-of-parts
    guideline:
      applicability_conditions:
        - technology: web
      expectations:
          text: The human language of each phrase is programmatically identified.

  wcag2ict_3_1_2:
    identifier: "3.1.2"
    name: Language of Parts
    source_document: wcag2ict
    fragment_class: success-criterion
    uri: https://www.w3.org/TR/wcag2ict/#language-of-parts
    guideline:
      applicability_conditions:
        # TODO elsewhere a list of conditions is "and" (which is a sensible default). Here it's "or". How to express that?
        - technology: non_web_document
        - technology: open_non_web_software
      expectations:
          text: >- #human
            [WCAG 2.2 SC 3.1.2](wcag22_3_1_2) → expectations
          # TODO Should rationale arguments be categorized with a programmatic distinction, like "ASKM human analysis"? Deferring this question until we have a need for it in an app.
          rationale:
            arguments_for:
              - >- #human
                Rules as written. There is word substitution for non-web terminology. Differences in the Notes do not change the intent.

  # TODO Should rationale arguments be categorized with a programmatic distinction, like "ASKM human analysis"? Deferring this question until we have a need for it in an app.

  # TODO is there a way we can generalize to all 9.x clauses, to avoid the high amount of repetition this would otherwise entail?
