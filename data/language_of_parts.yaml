      V3 clause 11.8.1 is equivalent to v4 clause 5.10.1 with minor editorial differences.
      V3 does not address a content creation tool that creates non-web software content.
  
  - id: open-content-vs-authoring-open-content
    type: todo
    subjects:
      - - wcag22_3_1_2
        - wcag2ict_3_1_2
      - - en301549v321_11_8_2
