# TODO I don't see value in identifying provenance of the whole YAML file. Each fragment should cite its own provenance. But the idea might be useful, as a similar provenance object at a more granular level.
provenance:
  kind: askm-original-analysis
  contributor: Mitchell Evan
  source:
    path: ../research/relationship_observations.md
    section: First attempt at relationship mapping — "language of parts"
  note: >-
    This is a structured draft of the contributor's prose research. Inclusion
    here does not mean that an accessibility interpretation has been validated
    or accepted into a formal ASKM model.

