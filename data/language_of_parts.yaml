            arguments_for:
              - >- #human
                IBR

  # TODO like v3
  en301549v410_10_3_1_2:
    identifier: "10.3.1.2"
    name: Language of parts
    source_document: en301549v410
    fragment_class: clause
    uri: >-
      https://www.etsi.org/deliver/etsi_en/301500_301599/301549/04.01.00_30/en_301549v040100va.pdf#page=82
    guideline:
      applicability_conditions:
        - technology: non_web_document
      expectations:
          text: >- #human
            The human language of each phrase is programmatically identified.

  en301549v321_12_1_2:
    identifier: "12.1.2"
    name: Accessible documentation
    source_document: en301549v321
    fragment_class: clause
    uri: >-
      https://www.etsi.org/deliver/etsi_en/301500_301599/301549/03.02.01_60/en_301549v030201p.pdf#page=84
    guideline:
      # TODO guideline with 3 cases can work. But think about this alternative: 3 guidelines.
      cases:
        # TODO is there a namespace within which these ids are unique?
        - id: documentation-in-any-format
          applicability_conditions:
            - text: >- #human
                Product documentation is provided in any format with the ICT, including non-digital.
          expectations:
            - text: >- #human
                The product documentation is made available in web format or a non-web document format.
        - id: documentation-in-web-format
          #TODO state in ASKM documentation that a list of applicability conditions is "and". This is fairly intuitive because the word "conditions" implies 'and', but should be made explicit.
          applicability_conditions:
            - technology: web
            - text: >- #human
                Product documentation in web format is provided with the ICT.
          expectations:
            #TODO move the equivalence to a relationship
            - text: >- #human
                The product documentation meets clause 9 (equivalent to WCAG 2.1).
        - id: documentation-in-non-web-format
          applicability_conditions:
            - technology: non_web_document
            - text: >- #human
                Product documentation in a non-web document format is provided with the ICT.
          expectations:
            #TODO move the overlap to a relationship
            - text: >- #human
                The product documentation meets clause 10 (overlaps with WCAG 2.1).

  en301549v321_12_2_4:
    identifier: "12.2.4"
    name: Accessible documentation
    source_document: en301549v321
    fragment_class: clause
    uri: >-
      https://www.etsi.org/deliver/etsi_en/301500_301599/301549/03.02.01_60/en_301549v030201p.pdf#page=85
    guideline:
      cases:
        - id: support-documentation-in-any-format
          applicability_conditions:
            - text: >- #human
                Documentation is provided in any format by support services, including non-digital.
          expectations:
            - text: >- #human
                The documentation is made available in web format or a non-web document format.
        - id: support-documentation-in-web-format
          applicability_conditions:
            - technology: web
            - text: >- #human
                Documentation in web format is provided by support services.
          expectations:
            #TODO move the equivalence to a relationship
            - text: >- #human
                The documentation meets clause 9 (equivalent to WCAG 2.1).
        - id: support-documentation-in-non-web-format
          applicability_conditions:
            - technology: non_web_document
            - text: >- #human
                Documentation in a non-web document format is provided by support services.
          expectations:
            #TODO move the overlap to a relationship
            - text: >- #human
                The documentation meets clause 10 (overlaps with WCAG 2.1).

  en301549v410_12_1:
    identifier: "12.1"
    name: Accessibility information about products
    source_document: en301549v410
    fragment_class: clause
    uri: >-
      https://www.etsi.org/deliver/etsi_en/301500_301599/301549/04.01.00_30/en_301549v040100va.pdf#page=106
    guideline:
      cases:
        - id: product-information-in-web-content
          applicability_conditions:
            - technology: web
            - text: >- #human
                Web content provides information about a product.
          expectations:
            - text: >- #human
                This information in web content meets clause 9 (overlaps WCAG 2.2).
        - id: product-information-in-non-web-document
          applicability_conditions:
            - technology: non_web_document
            - text: >- #human
                A non-web document provides information about a product.
          expectations:
            - text: >- #human
                This information in a non-web document meets clause 10 (overlaps WCAG 2.2).
        - id: product-information-in-non-web-software
          applicability_conditions:
            - technology: open_non_web_software #TODO rationale: why only open?
            - text: >- #human
                Non-web software provides information about a product.
          expectations:
            - text: >- #human
                This information in non-web software meets clause 11 (overlaps WCAG 2.2).

  en301549v410_12_2:
    identifier: "12.2"
    name: Accessibility information about services
    source_document: en301549v410
    fragment_class: clause
    uri: >-
      https://www.etsi.org/deliver/etsi_en/301500_301599/301549/04.01.00_30/en_301549v040100va.pdf#page=107
    guideline:
      cases:
        - id: service-information-in-web-content
          applicability_conditions:
            - technology: web
            - text: >- #human
                Web content provides information about a service.
          expectations:
            - text: >- #human
                This information in web content meets clause 9 (overlaps WCAG 2.2).
        - id: service-information-in-non-web-document
          applicability_conditions:
            - technology: non_web_document
            - text: >- #human
                A non-web document provides information about a service.
          expectations:
            - text: >- #human
                This information in a non-web document meets clause 10 (overlaps WCAG 2.2).
        - id: service-information-in-non-web-software
          applicability_conditions:
            - technology: open_non_web_software #TODO rationale: why only open?
            - text: >- #human
                Non-web software provides information about a service.
          expectations:
            - text: >- #human
                This information in non-web software meets clause 11 (overlaps WCAG 2.2).

  en301549v321_11_8_2:
    identifier: "11.8.2"
    name: Accessible content creation
    source_document: en301549v321
    fragment_class: clause
    guideline:
      cases:
        - id: creates-web-content
          applicability_conditions:
            - text: >- #human
                A content creation tool (defined in [clause 3.1 *Terms* 'authoring tool'](en301549v321_3_1_authoring_tool)) creates web content.
          expectations:
            - text: >- #human
                The content creation tool enables its users to create web content that meets clause 9 (equivalent to WCAG 2.1), to the extent described in [clause 11.8.1](en301549v321_11_8_1).
            - text: >- #human
                The content creation tool guides its users to create web content that meets clause 9 (overlaps WCAG 2.1), to the extent described in [clause 11.8.1](en301549v321_11_8_1).
        - id: creates-non-web-documents
          applicability_conditions:
            - text: >- #human
                A content creation tool (defined in [clause 3.1 *Terms* 'authoring tool'](en301549v321_3_1_authoring_tool)) creates non-web document content.
          expectations:
            - text: >- #human
                The content creation tool enables its users to create non-web document content that meets clause 10 (overlaps WCAG 2.1), to the extent described in [clause 11.8.1](en301549v321_11_8_1).
            - text: >- #human
                The content creation tool guides its users to create non-web document content that meets clause 10 (overlaps WCAG 2.1), to the extent described in [clause 11.8.1](en301549v321_11_8_1).

  en301549v410_5_10_2:
    identifier: "5.10.2"
    name: Accessible content creation
    source_document: en301549v410
    fragment_class: clause
    guideline:
      cases:
        - id: creates-web-content
          applicability_conditions:
            - text: >- #human
                A content creation tool (defined in [clause 3.1 *Terms* 'authoring tool'](en301549v410_3_1_authoring_tool)) creates web content.
          expectations:
            - text: >- #human
                The content creation tool enables its users to create web content that meets clause 9 (overlaps WCAG 2.2), to the extent described in [clause 5.10.1](en301549v410_5_10_1).
            - text: >- #human
                The content creation tool guides its users to create web content that meets clause 9 (overlaps WCAG 2.2), to the extent described in [clause 5.10.1](en301549v410_5_10_1).
        - id: creates-non-web-documents
          applicability_conditions:
            - text: >- #human
                A content creation tool (defined in [clause 3.1 *Terms* 'authoring tool'](en301549v410_3_1_authoring_tool)) creates non-web document content.
          expectations:
            - text: >- #human
                The content creation tool enables its users to create non-web document content that meets clause 10 (overlaps WCAG 2.2), to the extent described in [clause 5.10.1](en301549v410_5_10_1).
            - text: >- #human
                The content creation tool guides its users to create non-web document content that meets clause 10 (overlaps WCAG 2.2), to the extent described in [clause 5.10.1](en301549v410_5_10_1).
        - id: creates-non-web-software-content
          applicability_conditions:
            - text: >- #human
                A content creation tool (defined in [clause 3.1 *Terms* 'authoring tool'](en301549v410_3_1_authoring_tool)) creates non-web software content.
          expectations:
            - text: >- #human
                The content creation tool enables its users to create non-web software content that meets clause 11 (overlaps WCAG 2.2), to the extent described in [clause 5.10.1](en301549v410_5_10_1).
            - text: >- #human
                The content creation tool guides its users to create non-web software content that meets clause 11 (overlaps WCAG 2.2), to the extent described in [clause 5.10.1](en301549v410_5_10_1).

  en301549v321_5_1_3_14:
    identifier: "5.1.3.14"
    name: Spoken languages
    source_document: en301549v321
    fragment_class: clause
    uri: >-
      https://www.etsi.org/deliver/etsi_en/301500_301599/301549/03.02.01_60/en_301549v030201p.pdf#page=26
    guideline:
      applicability_conditions:
        - technology: closed_functionality
        - text: >- #human
            "Speech output is provided as non-visual access to closed functionality."
      expectations:
        - id: match-spoken-and-visual-language
          text: >- #human
            The human language of speech output is the same as the human language of the visual content. See the source clause for exceptions.

  en301549v410_5_1_3_14:
    identifier: "5.1.3.14"
    name: Spoken languages
    source_document: en301549v410
    fragment_class: clause
    guideline:
      applicability_conditions:
        - technology: closed_functionality
        - text: >- #human
            "Speech output is provided as non-visual access to closed functionality."
      expectations:
          text: >- #human
            The human language of speech output is the same as the human language of the visual content. See the source clause for exceptions.

  wcag2ict_A_3_3_1_2:
    identifier: "A_3_3.1.2"
    name: 3.1.2 Language of Parts
    source_document: wcag2ict
    fragment_class: fragment
    uri: >-
      https://www.w3.org/TR/wcag2ict/#success-criteria-problematic-for-closed-functionality
    retrieved: 2026-08-02
    fragment_text: >- #human verbatim
      3.1.2 Language of Parts — Depends upon language information in a programmatically determinable form intended to drive correct pronunciation. Where another mechanism achieves correct pronunciation for ICT with closed functionality, such as self-voicing, the intent of this success criterion would be met.
    guideline:
      applicability_conditions:
        - technology: closed_functionality
      expectations:
        - text: >- #human
            Built-in speech is available for nonvisual access. Pronunciation is correct.
          rationale:
            arguments_for:
              - text: >- #human
                  This SC is problematic because it depends on assistive technology. A built-in equivalent would help meet the intent.[(NOTE 1)](note1),[(WCAG2ICT NOTE 1)](wcag2ict|note1)
    citations:
      - id: note1
        text: >- #human
          Fragment as written.

  en301549v321_11_3_1_2:
    identifier: "11.3.1.2"
    name: Void
    source_document: en301549v321
    fragment_class: clause
    non_expectation:
      text: >- #human
        Void because "language of parts" would be impossible for software.

  en301549v410_11_3_1_2:
    identifier: "11.3.1.2"
    name: Language of Parts (Void)
    source_document: en301549v410
    fragment_class: clause
    non_expectation:
      text: >- #human
        Void because "language of parts" would be impossible for software.

# These citations draw from multiple sources.
citations:

  "wcag2ict|note1":
    - title: >- #human
        What to do when a WCAG success criterion assumes the presence of assistive technology
    - text: >- #human
        asdf
    - text: >- #human
        "Some [WCAG success] criteria discuss [making] content compatible with assistive technologies. Where ICT with closed functionality doesn’t support use of assistive technology or the platform does not have an accessibility API, providing equivalent information and operation through another mechanism, such as functions built into the software that behave like assistive technology, would help meet the intent of these success criteria." [WCAG2ICT Annex A: Success Criteria Problematic for Closed Functionality](wcag2ict_a).
      retrieved: 2026-08-02
    - text: >- #human
        "Where the wide range of assistive technologies or user agents are not available... something else needs to be provided or be required to facilitate accessibility as intended by WCAG 2." [WCAG2ICT Comments on Closed Functionality](wcag2ict_0_5).
      retrieved: 2026-08-02

relationships:
  - id: en301549v321-documentation-is-accessible
    #TODO (wait and see): Instead of listing the subjects here, consider listing the relationship id in each fragment. Programmatically it's the same, but it might make the YAML more human-readable, easier to write by hand.
    subjects:
      - en301549v321_12_1_2
      - en301549v321_12_2_4
    #TODO okay for now, but "aspects", "applicability", "relationship" feel a bit abstract. Wait and see, it might be possible to simplify this structure.
    aspects:
      applicability:
        relationship: overlapping
        #TODO consider formalizing applicability differences like the following examples. This would make the content more compatible with a decision-tree app. (These examples are human-written.)
          # Both clauses: The component is product documentation. The component is provided with the ICT. The component is also provided by support services.
          # 12.1.2 only: The component is product documentation. The component is provided with the ICT. The component is not provided by support services.
          # 12.2.4 only: The component is product documentation. The component is not provided with the ICT. The component is provided by support services.
          # 12.2.4 only: The component is documentation, The component is not product documentation. The component is provided by support services. (Hypothetical)
        similarities:
          - >- #human
            [Clause 12.1.2](en301549v321_12_1_2) applies to content provided "with the ICT", while [clause 12.2.4](en301549v321_12_2_4) applies to content provided "by support services". In practice this could often be the same content, e.g. online documentation could be provided via a link from the digital product and also provided via a link from support chat.
          - >- #human
            [Clause 12.1.2](en301549v321_12_1_2) applies to "product documentation" while [clause 12.2.4](en301549v321_12_2_4) applies to "documentation". In practice, most documentation related to ICT is product documentation.
        differences:
          - >- #human
            [Clause 12.1.2](en301549v321_12_1_2) applies to content provided "with the ICT", while [clause 12.2.4](en301549v321_12_2_4) applies to content provided "by support services". In practice these could sometimes be different resources.
          - >- #human
            [Clause 12.1.2](en301549v321_12_1_2) applies to "product documentation" while [clause 12.2.4](en301549v321_12_2_4) applies to "documentation". Hypothetically, support services could provide some other kind of documentation that is not "product documentation".
        rationale:
          arguments_for:
            - >- #human
              Rules as written.
            - >- #human
              Practical experience with real-world ICT.
      expectations:
        relationship: equivalent
        rationale:
          arguments_for:
            - >- #human
              Rules as written. The expectations differ only in the Notes, which do not change the intent.

  - id: en301549-v321-v410-language-of-parts-speech-output
    subjects:
      - en301549v321_5_1_3_14
      - en301549v410_5_1_3_14
    aspects:
      applicability:
        relationship: equivalent
        similarities:
          - >- #human
            The [phrase in v4](en301549v410_5_1_3_14) is more precise but conveys the same intent as in [v3.2.1](en301549v321_5_1_3_14).
      expectations:
        relationship: equivalent
        similarities:
          - >- #human
            The words are identical.

  #TODO Better would be showing similarities between the programmatic group and the pronunciation group of fragments. See if I can implement this in the fragments themselves.
  #TODO check YAML syntax for the similarities.
  - id: programmatic-language-vs-spoken-language
    subjects:
      - wcag22_3_1_2
      - en301549v410_5_1_3_14
    aspects:
      applicability:
        relationship: see_fragments
      expectations:
        relationship: custom
        similarities:
          - text: >- #human
              According to [Understanding SC 3.1.2](note1), part of the intent is "Screen readers can use the pronunciation rules of the language of the text."
            citations:
