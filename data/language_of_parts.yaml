  - id: model-authoring-support
    text: >-
      Add preservation, repair-assistance, and template clauses from EN 301 549
      V3.2.1 clauses 11.8.3–11.8.5 and V4.1.0 clauses 5.10.3–5.10.5.
  - id: compare-en-clause-9
    text: Compare clause 9 differences between EN 301 549 V3.2.1 and V4.1.0.
  - id: compare-en-clause-10
    text: Compare clause 10 differences between EN 301 549 V3.2.1 and V4.1.0.
  - id: clarify-software-technology
    text: >-
      Review whether product or service information in non-web software should
      be classified as open_non_web_software or a broader non-web software type.
